; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; Hardware Memory Specifications for Waveshare ESP32-S3-Touch-LCD-7
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

; Use board-specific ESP-IDF defaults instead of the generic dev-board config.
board_build.esp-idf.sdkconfig_path = sdkconfig.starter
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

; Serial Monitor & USB CDC Settings
monitor_speed = 115200
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue